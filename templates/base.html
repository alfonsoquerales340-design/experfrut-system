{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experfrut BI</title>
    
    <link rel="manifest" href="{% static 'js/manifest.json' %}">
    <meta name="theme-color" content="#28a745">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-dark text-white">
    <nav class="navbar navbar-dark bg-success mb-4 shadow">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <span class="navbar-brand mb-0 h1">
                <i class="fas fa-leaf me-2"></i> Experfrut System
            </span>
            
            <div class="d-flex gap-2">
                <button id="btnInstalarPWA" class="btn btn-warning btn-sm fw-bold d-none">
                    <i class="fas fa-download"></i> INSTALAR APP
                </button>
                
                {# CAMBIADO: Apuntamos directo a la ruta absoluta interna del Administrador #}
                <a href="/admin/" class="btn btn-outline-light btn-sm border-2 fw-bold">
                    <i class="fas fa-user-shield"></i> PANEL ADMIN
                </a>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
    // Registro básico del Service Worker que ya tenías configurado
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register("{% static 'js/sw.js' %}")
                .then(reg => console.log('¡Experfrut PWA registrada con éxito!', reg))
                .catch(err => console.error('Error al registrar la PWA', err));
        });
    }

    // --- NUEVO SCRIPT DE CAPTURA PARA INSTALACIÓN FORZADA ---
    let eventoInstalacion;
    const botonInstalar = document.getElementById('btnInstalarPWA');

    window.addEventListener('beforeinstallprompt', (e) => {
        // Previene que Android muestre el banner genérico para usar nuestro propio botón
        e.preventDefault();
        eventoInstalacion = e;
        // Hace visible el botón amarillo de "INSTALAR APP" en la barra de navegación
        if (botonInstalar) {
            botonInstalar.classList.remove('d-none');
        }
    });

    if (botonInstalar) {
        botonInstalar.addEventListener('click', async () => {
            if (!eventoInstalacion) return;
            // Muestra el prompt nativo del sistema operativo (Android/PC)
            eventoInstalacion.prompt();
            const { outcome } = await eventoInstalacion.userChoice;
            console.log(`El usuario respondió a la instalación: ${outcome}`);
            // Una vez instalado, volvemos a ocultar el botón
            botonInstalar.classList.add('d-none');
            eventoInstalacion = null;
        });
    }

    // Ocultar el botón si la aplicación ya se está ejecutando de forma independiente
    window.addEventListener('appinstalled', () => {
        console.log('¡Experfrut System instalado con éxito en el dispositivo!');
        if (botonInstalar) {
            botonInstalar.classList.add('d-none');
        }
    });
    </script>
</body>
</html>
