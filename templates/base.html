{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experfrut BI</title>
    
    <link rel="manifest" href="{% static 'js/manifest.json' %}">
    <meta name="theme-color" content="#28a745">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-dark text-white">
    <nav class="navbar navbar-dark bg-success mb-4 shadow">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <span class="navbar-brand mb-0 h1">
                <i class="fas fa-leaf me-2"></i> Experfrut System
            </span>
            
            <div>
                {# CAMBIADO: Apuntamos directo a la ruta absoluta interna del Administrador #}
                <a href="/admin/" class="btn btn-outline-light btn-sm border-2 fw-bold">
                    <i class="fas fa-user-shield"></i> PANEL ADMIN
                </a>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register("{% static 'js/sw.js' %}")
                .then(reg => console.log('¡Experfrut PWA registrada con éxito!', reg))
                .catch(err => console.error('Error al registrar la PWA', err));
        });
    }
    </script>
</body>
</html>
